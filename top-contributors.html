<!DOCTYPE html>
<html lang="en">
<head>
  <script src="ga4.js"></script>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Top 20 Contributors — PilotRep</title>
  <link rel="canonical" href="https://www.pilotrep.com/top-contributors.html" />

  <meta name="description" content="The pilots who have left the most reputation reports on PilotRep this month." />

  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="alternate icon" href="/favicon.ico" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  <link rel="stylesheet" href="site-footer.css" />

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:        #04080f;
      --panel:     #0e1a2b;
      --border:    rgba(100,180,255,0.10);
      --cyan:      #4fc3f7;
      --cyan-dim:  #2a8bbf;
      --white:     #e8eef5;
      --muted:     #5a7490;
    }

    html { scroll-behavior: smooth; }

    body {
      background: var(--bg);
      color: var(--white);
      font-family: Helvetica, Arial, sans-serif;
      font-weight: 400;
      min-height: 100vh;
      overflow-x: hidden;
    }

    .page { position: relative; z-index: 1; }

    /* ── TOP NAV (shared header, ported from pilot.html) ── */
    .topnav {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 24px;
      padding: 22px 32px;
      flex-wrap: wrap;
      position: relative;
    }
    .nav-left {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .nav-logo img { display: block; }
    .nav-logged-in {
      display: none;
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 0.12em;
      color: var(--muted);
      text-transform: uppercase;
    }
    .nav-logged-in a { color: var(--cyan); text-decoration: none; transition: color 0.15s; }
    .nav-logged-in a:hover { color: var(--white); }
    .nav-login-prompt {
      display: block;
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 0.12em;
      color: var(--cyan);
      text-transform: uppercase;
      text-decoration: none;
      cursor: pointer;
      transition: color 0.15s;
    }
    .nav-login-prompt:hover { color: var(--white); }
    .nav-links {
      display: inline-flex;
      gap: 0;
      flex: 1;
      justify-content: center;
      flex-wrap: nowrap;
      white-space: nowrap;
      position: absolute;
      left: 50%;
      transform: translateX(-50%);
    }
    .nav-links a {
      font-size: 11px;
      font-weight: 400;
      letter-spacing: 0.1em;
      color: var(--white);
      text-transform: uppercase;
      text-decoration: none;
      border: 1.5px solid var(--border);
      padding: 8px 18px;
      margin-left: -1.5px;
      transition: color 0.15s, border-color 0.15s, background 0.15s;
    }
    .nav-links a:first-child { border-radius: 4px 0 0 4px; margin-left: 0; }
    .nav-links a:last-child  { border-radius: 0 4px 4px 0; }
    .nav-links a.active {
      color: var(--cyan);
      border-color: var(--cyan);
      background: rgba(79,195,247,0.08);
    }
    .nav-links a.active:hover { color: #7dd8fa; border-color: var(--cyan); }
    .nav-links a:hover:not(.active) { color: var(--cyan); border-color: var(--cyan-dim); }

    .nav-right {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 8px;
    }
    .nav-search {
      display: flex;
      align-items: center;
      width: 320px;
      position: relative;
    }
    .nav-search input {
      flex: 1;
      background: rgba(79,195,247,0.08);
      border: 1.5px solid var(--cyan-dim);
      border-right: none;
      border-radius: 4px 0 0 4px;
      color: var(--white);
      font-family: Helvetica, Arial, sans-serif;
      font-size: 13px;
      padding: 8px 44px 8px 12px;
      outline: none;
      min-width: 0;
    }
    .nav-search input::placeholder { color: var(--muted); }
    .nav-search .nav-search-clear-btn {
      position: absolute;
      right: 48px;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      color: var(--muted);
      font-size: 17px;
      line-height: 1;
      cursor: pointer;
      padding: 4px;
      z-index: 2;
    }
    .nav-search .nav-search-clear-btn:hover { color: var(--white); }
    .nav-search button {
      background: var(--cyan);
      border: 1.5px solid var(--cyan);
      border-radius: 0 4px 4px 0;
      color: var(--bg);
      cursor: pointer;
      padding: 8px 11px;
      display: flex;
      align-items: center;
    }
    .nav-search svg { width: 14px; height: 14px; }
    .search-drop-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 9px 14px;
      cursor: pointer;
      font-size: 13px;
      color: var(--white);
      border-bottom: 1px solid rgba(79,195,247,0.08);
      text-decoration: none;
    }
    .search-drop-item:last-child { border-bottom: none; }
    .search-drop-item:hover { background: rgba(79,195,247,0.1); }
    .search-drop-label {
      font-size: 10px;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--muted);
      padding: 8px 14px 4px;
      border-bottom: 1px solid rgba(79,195,247,0.08);
    }
    .search-drop-name { flex: 1; }
    .search-drop-type {
      font-size: 10px;
      color: var(--cyan);
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }
    .search-drop-note {
      font-size: 12px;
      color: var(--muted);
      letter-spacing: 0.08em;
      padding: 12px 14px;
      text-align: center;
      border-top: 1px solid rgba(79,195,247,0.08);
      line-height: 1.6;
    }
    .search-drop-note a { color: var(--cyan); text-decoration: none; font-weight: 600; }
    .search-drop-note a:hover { color: #7dd8fa; }
    .nav-search-sub {
      font-size: 11px;
      color: var(--muted);
      letter-spacing: 0.03em;
      align-self: flex-start;
      padding-left: 12px;
    }
    @media (max-width: 760px) {
      .topnav { flex-direction: column; align-items: center; text-align: center; gap: 16px; padding: 24px 20px; }
      .nav-left { align-items: center; }
      .nav-links { position: static; left: auto; transform: none; width: 100%; }
      .nav-right { align-items: center; width: 100%; }
      .nav-search { width: 100%; max-width: 380px; margin: 0 auto; }
      .nav-search-sub { align-self: center; padding-left: 0; }
    }

    .tc-header {
      text-align: center;
      padding: 56px 24px 8px;
    }
    .tc-title-img {
      display: block;
      height: 64px;
      width: auto;
      margin: 0 auto 8px;
    }
    @media (max-width: 480px) {
      .tc-title-img { height: 48px; }
    }
    .tc-reset {
      font-size: 12px;
      color: var(--muted);
      letter-spacing: 0.04em;
    }

    .tc-my-rank {
      max-width: 520px;
      margin: 28px auto 0;
      padding: 0 24px;
    }
    .tc-my-rank-inner {
      background: rgba(79,195,247,0.06);
      border: 1.5px solid var(--cyan-dim);
      border-radius: 8px;
      padding: 12px 18px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 13px;
    }
    .tc-my-rank-label { color: var(--muted); }
    .tc-my-rank-value { color: var(--cyan); font-weight: 700; }

    .tc-list-wrap {
      max-width: 520px;
      margin: 32px auto 0;
      padding: 0 24px 60px;
    }
    .tc-panel {
      background: var(--panel);
      border: 1.5px solid var(--border);
      border-radius: 8px;
      overflow: hidden;
    }
    .tc-row-header, .tc-row {
      display: grid;
      grid-template-columns: 32px 1fr 70px;
      align-items: center;
      padding: 12px 18px;
    }
    .tc-row-header {
      border-bottom: 1.5px solid var(--border);
      font-size: 11px;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.06em;
    }
    .tc-row { border-bottom: 1px solid rgba(100,180,255,0.06); }
    .tc-row:last-child { border-bottom: none; }
    .tc-row:nth-child(even) { background: rgba(79,195,247,0.03); }
    .tc-rank { font-size: 14px; font-weight: 700; color: var(--muted); }
    .tc-rank.gold   { color: #f0c542; }
    .tc-rank.silver { color: #c7cdd6; }
    .tc-rank.bronze { color: #a9744a; }
    .tc-pilot { display: flex; align-items: center; gap: 10px; min-width: 0; }
    .tc-pilot-avatar {
      width: 28px; height: 28px; border-radius: 50%;
      background: rgba(79,195,247,0.15); flex-shrink: 0;
      object-fit: cover;
    }
    .tc-pilot-name {
      font-size: 13.5px; font-weight: 700; color: var(--white);
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
      text-decoration: none;
      transition: color 0.15s;
    }
    .tc-pilot-name:hover { color: var(--cyan); }
    .tc-count { font-size: 14px; font-weight: 700; color: var(--cyan); text-align: right; }
    .tc-empty { padding: 40px 18px; text-align: center; color: var(--muted); font-size: 13px; }

    .tc-archive-link {
      display: block;
      max-width: 520px;
      margin: 18px auto 0;
      padding: 0 24px;
      text-align: center;
    }
    .tc-archive-link a {
      display: inline-block;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--cyan);
      text-decoration: none;
      border: 1.5px solid var(--cyan-dim);
      border-radius: 6px;
      padding: 10px 20px;
      transition: color 0.15s, border-color 0.15s, background 0.15s;
    }
    .tc-archive-link a:hover {
      color: var(--white);
      border-color: var(--cyan);
      background: rgba(79,195,247,0.08);
    }

  </style>
</head>
<body>
<div class="page">

  <header class="topnav">
    <div class="nav-left">
      <a href="index.html" class="nav-logo"><img src="assets/images/PilotRep_Logo_NavBar.svg" alt="Pilot Rep" style="height:38px;width:auto;display:block;" /></a>
      <div class="nav-logged-in" id="navLoggedInAs">LOGGED IN AS &nbsp;<a href="pilot.html" id="navLoggedInLink">—</a></div>
      <a href="#" class="nav-login-prompt" id="navLoginPrompt" onclick="event.preventDefault(); window.location.href='/.netlify/functions/auth-start?origin='+encodeURIComponent(window.location.pathname+window.location.search);">Log In With EVE Online</a>
    </div>

    <nav class="nav-links">
      <a href="pilot-landing.html">Pilots</a>
      <a href="corporation-landing.html">Corporations</a>
      <a href="alliance-landing.html">Alliances</a>
    </nav>

    <div class="nav-right">
      <div class="nav-search" style="position:relative;">
        <input type="text" id="navSearchInput" placeholder="Search for Pilots, Corporations and Alliances" autocomplete="off" />
        <button id="navSearchClear" class="nav-search-clear-btn" aria-label="Clear search" type="button" style="display:none;">&times;</button>
        <button id="navSearchBtn" aria-label="Search">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
          </svg>
        </button>
        <div id="searchDropdown" style="display:none;position:absolute;top:100%;left:0;right:0;background:#0e1a2b;border:1px solid var(--cyan-dim);border-radius:0 0 6px 6px;z-index:999;max-height:360px;overflow-y:auto;"></div>
      </div>
      <div class="nav-search-sub">Search New Eden. Rate Encounters.</div>
    </div>
  </header>

  <div class="tc-header">
    <img class="tc-title-img" src="assets/images/PR_Top_20.svg" alt="Top 20 Contributors" />
    <div class="tc-reset" id="tcResetLine">Until —</div>
  </div>

  <div class="tc-my-rank" id="tcMyRank" style="display:none;">
    <div class="tc-my-rank-inner">
      <span class="tc-my-rank-label">Your rank this month</span>
      <span class="tc-my-rank-value" id="tcMyRankValue">—</span>
    </div>
  </div>

  <div class="tc-list-wrap">
    <div class="tc-panel">
      <div class="tc-row-header">
        <div>#</div>
        <div>Pilot</div>
        <div style="text-align:right;">Qualifying Reps</div>
      </div>
      <div id="tcRows">
        <div class="tc-empty">Loading…</div>
      </div>
    </div>
  </div>

  <div class="tc-archive-link">
    <a href="previous-top20.html">Previous Top 20 Contributors</a>
  </div>

  <script src="site-footer.js"></script>

</div>

<script src="login-success-modal.js"></script>
<script>
  const months = ['January','February','March','April','May','June','July','August','September','October','November','December'];
  const now = new Date();
  const lastDay = new Date(now.getFullYear(), now.getMonth() + 1, 0);
  document.getElementById('tcResetLine').textContent =
    'Until ' + months[lastDay.getMonth()] + ' ' + lastDay.getDate();

  function escapeHtml(str) {
    const div = document.createElement('div');
    div.textContent = str;
    return div.innerHTML;
  }

  function rankClass(rank) {
    if (rank === 1) return 'gold';
    if (rank === 2) return 'silver';
    if (rank === 3) return 'bronze';
    return '';
  }

  (async () => {
    try {
      const res = await fetch('/.netlify/functions/top-contributors');
      const data = await res.json();
      const rowsEl = document.getElementById('tcRows');

      if (!res.ok || !data.top || data.top.length === 0) {
        rowsEl.innerHTML = '<div class="tc-empty">No qualifying reps yet this month. Be the first on the board.</div>';
        return;
      }

      rowsEl.innerHTML = data.top.map(row => `
        <div class="tc-row">
          <div class="tc-rank ${rankClass(row.rank)}">${row.rank}</div>
          <div class="tc-pilot">
            <img class="tc-pilot-avatar" src="https://images.evetech.net/characters/${row.reviewer_id}/portrait?size=64" alt="" />
            <a class="tc-pilot-name" href="pilot.html?id=${row.reviewer_id}">${escapeHtml(row.reviewer_name || 'Unknown Pilot')}</a>
          </div>
          <div class="tc-count">${row.qualifying_reps}</div>
        </div>
      `).join('');

      if (data.myRank) {
        document.getElementById('tcMyRank').style.display = 'block';
        document.getElementById('tcMyRankValue').textContent =
          '#' + data.myRank.rank + ' — ' + data.myRank.qualifying_reps + ' qualifying reps';
      }
    } catch (err) {
      console.error('Top contributors load error:', err);
      document.getElementById('tcRows').innerHTML = '<div class="tc-empty">Could not load the leaderboard. Please try again.</div>';
    }
  })();

  (async () => {
    try {
      const res = await fetch('/.netlify/functions/auth-me');
      const data = await res.json();
      if (data.loggedIn) {
        const authLink = document.getElementById('footerAuthLink');
        if (authLink) {
          authLink.textContent = 'Logout';
          authLink.href = '/.netlify/functions/auth-logout';
        }
        const navLoggedIn = document.getElementById('navLoggedInAs');
        const navLoggedInLink = document.getElementById('navLoggedInLink');
        if (navLoggedIn && navLoggedInLink && data.characterId) {
          navLoggedInLink.textContent = data.characterName;
          navLoggedInLink.href = 'my-pilotrep.html';
          navLoggedIn.style.display = 'block';
        }
        const navLoginPrompt = document.getElementById('navLoginPrompt');
        if (navLoginPrompt) navLoginPrompt.style.display = 'none';
      }
    } catch (_) {}
  })();

  // ── SEARCH BAR (ported from pilot.html) ─────────────────────────────────
  const searchInput    = document.getElementById('navSearchInput');
  const searchBtn      = document.getElementById('navSearchBtn');
  const searchClearBtn = document.getElementById('navSearchClear');
  const searchDropdown = document.getElementById('searchDropdown');

  let searchTimer;

  searchInput.addEventListener('input', () => {
    searchClearBtn.style.display = searchInput.value.length ? 'block' : 'none';
    clearTimeout(searchTimer);
    const q = searchInput.value.trim();
    if (q.length < 3) { searchDropdown.style.display = 'none'; return; }
    searchTimer = setTimeout(() => runSearch(), 300);
  });

  searchClearBtn.addEventListener('click', () => {
    searchInput.value = '';
    searchClearBtn.style.display = 'none';
    searchDropdown.style.display = 'none';
    searchInput.focus();
  });

  function goToSearchPage() {
    const q = searchInput.value.trim();
    if (q.length < 3) return;
    window.location.href = `/search.html?q=${encodeURIComponent(q)}`;
  }

  searchInput.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') goToSearchPage();
  });

  searchBtn.addEventListener('click', goToSearchPage);

  async function runSearch() {
    const q = searchInput.value.trim();
    if (q.length < 3) { searchDropdown.style.display = 'none'; return; }
    try {
      const res = await fetch(`/.netlify/functions/esi-proxy?action=search&query=${encodeURIComponent(q)}`);
      const data = await res.json();
      renderDropdown(data, q);
    } catch (e) {
      searchDropdown.style.display = 'none';
    }
  }

  function renderDropdown(data, q) {
    const { characters = [], corporations = [], alliances = [], mode = 'authenticated' } = data;
    const total = characters.length + corporations.length + alliances.length;
    const advancedSearchNote = `<div class="search-drop-note">For Advanced Search<br><a href="/.netlify/functions/auth-start">Log In With EVE Online</a></div>`;
    if (total === 0) {
      if (mode === 'community' || mode === 'fallback') {
        searchDropdown.innerHTML = advancedSearchNote;
        searchDropdown.style.display = 'block';
      } else {
        searchDropdown.style.display = 'none';
      }
      return;
    }

    let html = '';
    if (characters.length) {
      html += `<div class="search-drop-label">Pilots</div>`;
      characters.forEach(c => {
        html += `<a class="search-drop-item" href="/pilot.html?id=${c.id}">
          <span class="search-drop-name">${c.name}</span>
          <span class="search-drop-type">Pilot</span>
        </a>`;
      });
    }
    if (corporations.length) {
      html += `<div class="search-drop-label">Corporations</div>`;
      corporations.forEach(c => {
        html += `<a class="search-drop-item" href="/corporation.html?id=${c.id}">
          <span class="search-drop-name">${c.name}</span>
          <span class="search-drop-type">Corp</span>
        </a>`;
      });
    }
    if (alliances.length) {
      html += `<div class="search-drop-label">Alliances</div>`;
      alliances.forEach(a => {
        html += `<a class="search-drop-item" href="/alliance.html?id=${a.id}">
          <span class="search-drop-name">${a.name}</span>
          <span class="search-drop-type">Alliance</span>
        </a>`;
      });
    }
    if (mode === 'community' || mode === 'fallback') {
      html += advancedSearchNote;
    } else {
      html += `<a class="search-drop-item" href="/search.html?q=${encodeURIComponent(q)}" style="color:var(--cyan);justify-content:center;">
        See all results for "${q}" →
      </a>`;
    }

    searchDropdown.innerHTML = html;
    searchDropdown.style.display = 'block';
  }

  // Close dropdown when clicking outside
  document.addEventListener('click', (e) => {
    if (!e.target.closest('.nav-search')) searchDropdown.style.display = 'none';
  });
</script>
</body>
</html>
