<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PilotRep — Coming Soon to New Eden</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="alternate icon" href="/favicon.ico" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:        #04080f;
      --cyan:      #4fc3f7;
      --cyan-dim:  #2a8bbf;
      --white:     #e8eef5;
      --muted:     #5a7490;
      --border:    rgba(100,180,255,0.10);
    }

    html { scroll-behavior: smooth; }

    body {
      background: var(--bg);
      color: var(--white);
      font-family: Helvetica, Arial, sans-serif;
      font-weight: 400;
      min-height: 100vh;
      overflow-x: hidden;
      position: relative;
    }

    /* ── STARFIELD / VIDEO BACKDROP ── */
    .starfield {
      position: fixed;
      inset: 0;
      z-index: 0;
      overflow: hidden;
      pointer-events: none;
    }

    /* Background video styling */
    .starfield-video {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      opacity: 0.65; /* Adjust opacity to blend with dark background */
    }

    /* Gradient overlay for New Eden lighting depth */
    .starfield::after {
      content: "";
      position: absolute;
      inset: -10%;
      background:
        radial-gradient(ellipse 900px 600px at 50% 38%, rgba(79,195,247,0.10), transparent 60%),
        radial-gradient(ellipse 600px 500px at 60% 30%, rgba(232,135,26,0.06), transparent 65%),
        radial-gradient(ellipse 700px 700px at 40% 45%, rgba(79,195,247,0.05), transparent 70%);
      pointer-events: none;
    }

    /* ── LAYOUT ── */
    .page {
      position: relative;
      z-index: 1;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 40px 24px;
    }

    .logo-wrap { margin-bottom: 20px; }
    .logo-wrap img { height: auto; max-width: 100%; margin: 0 auto; }
    .logo-desktop { display: block; width: clamp(312px, 55vw, 680px); }
    .logo-mobile { display: none; width: clamp(200px, 65vw, 340px); }
    @media (max-width: 640px) {
      .logo-desktop { display: none; }
      .logo-mobile { display: block; }
    }

    .tagline-wrap { margin-bottom: 26px; }
    .tagline-wrap img { height: auto; max-width: 100%; margin: 0 auto; }
    .tagline-desktop { display: block; width: clamp(260px, 42vw, 520px); }
    .tagline-mobile { display: none; width: clamp(200px, 65vw, 320px); }
    @media (max-width: 640px) {
      .tagline-desktop { display: none; }
      .tagline-mobile { display: block; }
    }

    .coming-soon {
      font-size: 15px;
      font-weight: 600;
      letter-spacing: 0.18em;
      color: var(--white);
      text-transform: uppercase;
      margin-bottom: 22px;
    }

    /* ── NOTIFY ME ── */
    .notify-link {
      display: inline-block;
      background: none;
      border: none;
      color: var(--cyan);
      font-family: Helvetica, Arial, sans-serif;
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      text-decoration: none;
      cursor: pointer;
      padding: 6px 4px;
      transition: color 0.15s;
    }
    .notify-link:hover { color: #7dd8fa; }
    .notify-link.is-hidden { display: none; }

    .notify-form {
      display: none;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      margin-top: 6px;
      width: 100%;
      max-width: 360px;
    }
    .notify-form.is-open { display: flex; }

    .notify-form input {
      width: 100%;
      background: rgba(79,195,247,0.08);
      border: 1.5px solid var(--cyan-dim);
      border-radius: 4px;
      color: var(--white);
      font-family: Helvetica, Arial, sans-serif;
      font-size: 14px;
      padding: 11px 14px;
      outline: none;
      transition: border-color 0.2s, background 0.2s;
    }
    .notify-form input::placeholder { color: var(--muted); }
    .notify-form input:focus {
      border-color: var(--cyan);
      background: rgba(79,195,247,0.13);
    }

    .notify-submit {
      width: 100%;
      background: var(--cyan);
      border: 1.5px solid var(--cyan);
      border-radius: 4px;
      color: var(--bg);
      cursor: pointer;
      font-family: Helvetica, Arial, sans-serif;
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      padding: 11px 14px;
      transition: background 0.2s;
    }
    .notify-submit:hover { background: #7dd8fa; }
    .notify-submit:disabled { opacity: 0.6; cursor: default; }

    .notify-error {
      display: none;
      font-size: 11px;
      color: #e8871a;
      letter-spacing: 0.04em;
    }
    .notify-error.is-visible { display: block; }

    .notify-success {
      display: none;
      font-size: 13px;
      color: var(--cyan);
      letter-spacing: 0.05em;
      margin-top: 6px;
      max-width: 360px;
    }
    .notify-success.is-visible { display: block; }

    .footer-info {
      position: absolute;
      bottom: 32px;
      left: 0;
      right: 0;
      text-align: center;
    }
    .footer-contact {
      display: block;
      font-size: 11px;
      color: var(--muted);
      letter-spacing: 0.05em;
      text-decoration: none;
      margin-bottom: 8px;
      transition: color 0.15s;
    }
    .footer-contact:hover { color: var(--cyan); }
    .footer-copy {
      font-size: 11px;
      color: var(--muted);
      letter-spacing: 0.05em;
    }
  </style>
</head>
<body>

  <div class="starfield" aria-hidden="true">
    <video class="starfield-video" autoplay loop muted playsinline poster="assets/images/starfield-fallback.jpg">
      <source src="assets/videos/starfield.webm" type="video/webm" />
      <source src="assets/videos/starfield.mp4" type="video/mp4" />
    </video>
  </div>

  <div class="page">
    <div class="logo-wrap">
      <img class="logo-desktop" src="assets/images/PilotRep_Logo_Main.svg" alt="Pilot Rep" />
      <img class="logo-mobile" src="assets/images/PilotRep_Logo_Main.svg" alt="Pilot Rep" />
    </div>

    <div class="tagline-wrap">
      <img class="tagline-desktop" src="assets/images/PR_Rep_Title.svg" alt="Reputation Precedes You" />
      <img class="tagline-mobile" src="assets/images/PR_Rep_Title.svg" alt="Reputation Precedes You" />
    </div>

    <div class="coming-soon">Coming Soon to New Eden</div>

    <a href="#" class="notify-link" id="notifyLink">Notify Me At Launch</a>

    <form class="notify-form" id="notifyForm" name="notify-signup" data-netlify="true" netlify-honeypot="notify-hp" novalidate>
      <input type="hidden" name="form-name" value="notify-signup" />
      <input type="text" name="notify-hp" style="display:none" tabindex="-1" autocomplete="off" />
      <input type="text" id="notifyName" name="name" placeholder="Pilot Name" autocomplete="off" />
      <input type="email" id="notifyEmail" name="email" placeholder="Email Address" autocomplete="off" />
      <div class="notify-error" id="notifyError"></div>
      <button type="submit" class="notify-submit" id="notifySubmit">Notify Me</button>
    </form>

    <div class="notify-success" id="notifySuccess">You're on the list, capsuleer. We'll signal you the moment PilotRep goes live.</div>
  </div>

  <div class="footer-info">
    <div class="footer-copy">&copy; 2026 PilotRep. All rights reserved.</div>
  </div>

<script>
  const notifyLink    = document.getElementById('notifyLink');
  const notifyForm    = document.getElementById('notifyForm');
  const notifyName    = document.getElementById('notifyName');
  const notifyEmail   = document.getElementById('notifyEmail');
  const notifyError   = document.getElementById('notifyError');
  const notifySubmit  = document.getElementById('notifySubmit');
  const notifySuccess = document.getElementById('notifySuccess');

  notifyLink.addEventListener('click', (e) => {
    e.preventDefault();
    notifyForm.classList.add('is-open');
    notifyLink.classList.add('is-hidden');
    notifyName.focus();
  });

  function isValidEmail(value) {
    return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(value);
  }

  notifyForm.addEventListener('submit', (e) => {
    e.preventDefault();
    const name = notifyName.value.trim();
    const email = notifyEmail.value.trim();

    if (!name) {
      notifyError.textContent = 'Please enter your pilot name.';
      notifyError.classList.add('is-visible');
      notifyName.focus();
      return;
    }
    if (!isValidEmail(email)) {
      notifyError.textContent = 'Please enter a valid email address.';
      notifyError.classList.add('is-visible');
      notifyEmail.focus();
      return;
    }
    notifyError.classList.remove('is-visible');

    notifySubmit.disabled = true;
    notifySubmit.textContent = 'Submitting…';

    const formData = new URLSearchParams(new FormData(notifyForm)).toString();

    fetch('/', {
      method: 'POST',
      headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
      body: formData
    })
      .then((res) => {
        if (!res.ok) throw new Error('Form submission rejected: ' + res.status);
        notifyForm.classList.remove('is-open');
        notifySuccess.classList.add('is-visible');
      })
      .catch(() => {
        notifyError.textContent = 'Something went wrong. Please try again.';
        notifyError.classList.add('is-visible');
        notifySubmit.disabled = false;
        notifySubmit.textContent = 'Notify Me';
      });
  });
</script>
</body>
</html>
